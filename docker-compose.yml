services:
  postgres:
    image: postgres:16
    container_name: chatbot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: optimus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rohanvasudeva

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optimus"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: multi-turn-chatbot
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: